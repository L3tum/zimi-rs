# Boots THIS JOB's throwaway pgvector Postgres on a PRIVATE per-job docker
# network — NO host port at all.
#
# WHY not the `services:` block: the runner's job containers ride the host
# network (act-based runner config), and services inherit it too — there,
# `ports:` mappings are a no-op and service hostnames don't resolve, so the
# old scheme pinned one real host port per job (5432-5438) and parallel jobs
# collided on a common port (a losing postgres can never bind and never goes
# healthy). Here the container listens on 5432 inside its own bridge network;
# the (host-network) job reaches it at the bridge IP, which is unique per run
# by construction — nothing here can collide with a host service or another
# job. The job container CAN reach any bridge IP directly (no port publish
# needed), and the docker socket is available in every job (the docker job's
# `docker build`/`docker run` prove it).
#
# Exports (job env, visible to every later step incl. the teardown):
#   ZIM_PG     — container name
#   ZIM_PG_NET — network name
#   ZIM_PG_IP  — bridge IP (use postgres://zimservice:zimservice@$ZIM_PG_IP:5432/...)
#
# Credentials/DB name are fixed (zimservice/zimservice/zimservice) — same
# throwaway test-only contract as the old services blocks; never point a real
# deployment at it.
name: ci-postgres
inputs:
  image:
    description: Postgres image (must carry the pgvector extension; stock postgres:16 does not)
    default: pgvector/pgvector:pg16
    required: false
runs:
  using: composite
  steps:
    - name: Boot postgres on a private per-job network
      shell: bash
      run: |
        set -euo pipefail
        SUFFIX="$(date +%s)-$$"
        NET="zimci-pg-$SUFFIX"
        CTR="zimci-pg-$SUFFIX"
        # Export the names BEFORE any docker call: if this step fails later
        # (image pull, readiness timeout, ...), the teardown step can still
        # reap whatever was created. ZIM_PG_IP is exported only at the end,
        # so no consumer ever sees a URL for a database that did not come up.
        echo "ZIM_PG=$CTR" >> "$GITHUB_ENV"
        echo "ZIM_PG_NET=$NET" >> "$GITHUB_ENV"
        docker network create "$NET"
        docker run -d --name "$CTR" --network "$NET" \
          -e POSTGRES_USER=zimservice \
          -e POSTGRES_PASSWORD=zimservice \
          -e POSTGRES_DB=zimservice \
          "${{ inputs.image }}"
        for i in $(seq 1 30); do
          if docker exec "$CTR" pg_isready -q -U zimservice -h 127.0.0.1 -p 5432; then
            break
          fi
          sleep 1
        done
        # Loud failure if the 30 s poll never saw a ready server (the poll
        # above swallows the exit code in the `if`).
        docker exec "$CTR" pg_isready -q -U zimservice -h 127.0.0.1 -p 5432
        IP="$(docker inspect -f '{{range $n, $net := .NetworkSettings.Networks}}{{$net.IPAddress}} {{end}}' "$CTR" | tr -d '[:space:]')"
        [ -n "$IP" ] || { echo "ci-postgres: $CTR has no bridge IP" >&2; exit 1; }
        echo "ZIM_PG_IP=$IP" >> "$GITHUB_ENV"
        echo "ci-postgres: $CTR ready at $IP:5432 (network $NET — no host port)"
