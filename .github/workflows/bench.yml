# Weekly performance-trend detector (2026-09 review, Perf) — see the
# `bench` job below.
#
# WHY a separate file (and not a job in ci.yml): the `on: schedule` trigger
# fires the ENTIRE workflow it is declared in — putting a scheduled job in
# ci.yml would re-run every gate (lint/test/coverage/docker) on Mondays for
# no reason. A dedicated file keeps the weekly run scoped to
# the benches. `workflow_dispatch` makes the job's config verifiable
# on-demand (a broken scheduled job would otherwise stay broken until the
# next cron fire) without ever running automatically.
#
# Non-blocking by construction: scheduled runs cannot gate a PR or a push,
# so a regression here is an investigation signal (compare this run's
# numbers against the previous week's), not an automatic block. Making it
# blocking would be a policy decision, not a config tweak — and the
# `trgm_plan` EXPLAIN gate in ci.yml already pins search plan SHAPE on
# every PR, which is where timing regressions must be caught early.
#
# Each run uploads its full criterion data as the `criterion-data` artifact
# (persistent, per-run versioned record).
#
# Baseline comparison: every run compares each benchmark against the
# COMMITTED baseline (criterion/<group>/week0/). It was captured on the dev
# box against the shared dev DB, and the runner differs (CPU + loopback
# Postgres), so the reported deltas include a roughly CONSTANT hardware
# offset — read week-over-week DRIFT in the deltas (a sudden extra shift is
# the signal), not the absolute delta vs the dev box. Machine-specific
# caveat: week-over-week comparisons are machine-specific — the runner's
# CPU is not a fixed property of the repo, so a runner swap reads as a
# global level shift; treat every week-over-week comparison as a trend
# signal only, not a measurement. The comparison is informational: the job
# still only hard-fails on a vacuous (DB-skip) run.
# When bench code or the fixture changes, refresh with `make bench-baseline`
# and commit criterion/ — comparing stale fixture data is worse than no
# comparison.
on:
  # Mondays 06:23 UTC (off-peak, not on the round hour).
  schedule:
    - cron: "23 6 * * 1"
  # Manual run (Actions → Bench → Run workflow) to validate or re-sample.
  workflow_dispatch:

# Least-privilege GITHUB_TOKEN: read the repo + write artifacts only
# (the criterion-data upload). The default token otherwise carries write
# access to the repo.
permissions:
  contents: read
  actions: write

# Runner notes: actions/* @v7 (checkout, upload-artifact) run on the
# runner's Node 24; the Rust toolchain comes from the repo-local
# ./.github/actions/setup-rust composite (the runner's action mirror 404s
# third-party actions). See ci.yml for the full note.

jobs:
  bench:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b   # stock postgres:16 lacks the `vector` extension migration 001 creates
        env:
          POSTGRES_USER: zimservice
          POSTGRES_PASSWORD: zimservice
          POSTGRES_DB: zimservice
          # Host-network runner (ci.yml note): this job's real port — 5436
          # so a scheduled bench run can overlap a push-triggered CI run
          # without a bind collision.
          PGPORT: "5436"
        ports: ["5436:5436"]
        options: >-
          --health-cmd "pg_isready -U zimservice -p 5436"
          --health-interval 2s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-rust
        with: { toolchain: "1.96.0" }
      - name: Run benches against the committed week0 baseline
        run: |
          set -o pipefail
          out=$(mktemp); trap "rm -f $out" EXIT
          # Sync the committed baseline (criterion/<group>/week0/) into
          # criterion's home (target/criterion) — criterion reads baselines
          # from its home directory, not the repo path. Same sync as
          # `make bench-compare` (POSIX sh + cp).
          for d in criterion/*/week0; do
            g="${d#criterion/}"
            mkdir -p "target/criterion/$g"
            cp -r "$d/." "target/criterion/$g/"
          done
          # One explicit target per invocation (NOT bare `cargo bench`):
          # a bare run also selects the lib/bin targets, whose libtest
          # harness would reject criterion's --baseline flag and fail the
          # job before any benchmark runs.
          echo "::notice::comparing against the committed week0 baseline (dev-box capture) — read week-over-week drift in the deltas, not the absolute hardware offset; week-over-week comparisons are machine-specific, trend signal only"
          DATABASE_URL=postgres://zimservice:zimservice@localhost:5436/zimservice \
            cargo bench --bench retrieval -- --baseline week0 2>&1 | tee "$out"
          DATABASE_URL=postgres://zimservice:zimservice@localhost:5436/zimservice \
            cargo bench --bench search -- --baseline week0 2>&1 | tee -a "$out"
          # The benches' loud-skip policy (benches/{search,retrieval}.rs)
          # prints `BENCH SKIPPED (<name>): no reachable Postgres` and exits
          # 0 — mirror the `test` job's treatment of a vacuous run: fail
          # loudly instead of recording an empty data point. The service
          # above is this job's contract; a missing DB is a CI-infra failure.
          if grep -qF "BENCH SKIPPED" "$out"; then
            echo "::error::bench skipped vacuously — the Postgres service must be reachable for this job"
            exit 1
          fi
      # `if: always()` so the data is kept even when the run failed (that is
      # exactly when it is most useful). The artifact is versioned per run;
      # it is the persistent record the trend comparison is read from.
      - name: Upload criterion data (persistent per-run record)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: criterion-data
          path: target/criterion
          if-no-files-found: warn
