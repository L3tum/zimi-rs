# Weekly performance-trend detector (2026-09 review, Perf) — see the
# `bench` job below.
#
# WHY a separate file (and not a job in ci.yml): the `on: schedule` trigger
# fires the ENTIRE workflow it is declared in — putting a scheduled job in
# ci.yml would re-run every gate (lint/test/coverage/docker/cross-platform)
# on Mondays for no reason. A dedicated file keeps the weekly run scoped to
# the benches. `workflow_dispatch` makes the job's config verifiable
# on-demand (a broken scheduled job would otherwise stay broken until the
# next cron fire) without ever running automatically.
#
# Non-blocking by construction: scheduled runs cannot gate a PR or a push,
# so a regression here is an investigation signal (compare this run's
# numbers against the previous week's), not an automatic block. Making it
# blocking would be a policy decision, not a config tweak — and the
# `trgm_plan` EXPLAIN gate in ci.yml already pins search plan SHAPE on
# every PR, which is where timing regressions must be caught early.
on:
  # Mondays 06:23 UTC (off-peak, not on the round hour).
  schedule:
    - cron: "23 6 * * 1"
  # Manual run (Actions → Bench → Run workflow) to validate or re-sample.
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16   # stock postgres:16 lacks the `vector` extension migration 001 creates
        env:
          POSTGRES_USER: zimservice
          POSTGRES_PASSWORD: zimservice
          POSTGRES_DB: zimservice
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U zimservice"
          --health-interval 2s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - run: |
          set -o pipefail
          out=$(mktemp); trap "rm -f $out" EXIT
          DATABASE_URL=postgres://zimservice:zimservice@localhost:5433/zimservice \
            cargo bench 2>&1 | tee "$out"
          # The benches' loud-skip policy (benches/{search,retrieval}.rs)
          # prints `BENCH SKIPPED (<name>): no reachable Postgres` and exits
          # 0 — mirror the `test` job's treatment of a vacuous run: fail
          # loudly instead of recording an empty data point. The service
          # above is this job's contract; a missing DB is a CI-infra failure.
          if grep -qF "BENCH SKIPPED" "$out"; then
            echo "::error::bench skipped vacuously — the Postgres service must be reachable for this job"
            exit 1
          fi
