name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned toolchain (1.96.0): keeps the rustdoc/clippy gates deterministic —
      # a moving `stable` once made the docs gate flaky. Bump deliberately; the
      # MSRV job below still guards 1.91.
      - uses: dtolnay/rust-toolchain@1.96.0
        with: { components: rustfmt, clippy }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      # Doctests live here (moved out of the `test` job).
      - run: cargo test --doc
      # M2: raw-SQL boundary lint — flags sqlx::query* call sites outside
      # src/db/ (the sanctioned db::raw escape hatch) that lack a
      # `// RAW-OK: <reason>` marker. Post-SeaORM the rule is: raw SQL outside
      # `src/db/` must carry a `// RAW-OK` marker. POSIX sh, no dependencies.
      - run: make raw-sql-lint
      # JS syntax check for the embedded web UI (dependency-free, ~seconds).
      # Strict because `make web-check` skips silently without node; CI always
      # has node, so a missing-node must fail the gate, not pass it.
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: make web-check
        env:
          ZIMSERVICE_WEB_CHECK_STRICT: "1"
      # Behavioral unit tests for web/common.js helpers (apiFetch admin-auth
      # flow, esc, formatters) — same strict policy: CI always has node.
      - run: make web-test
        env:
          ZIMSERVICE_WEB_CHECK_STRICT: "1"
  # Real JS lint (eslint) of the embedded web UI: web/common.js + the
  # per-page scripts (web/index.js, web/search.js, web/settings.js). Kept as
  # a separate job (not folded into `lint`) so lint findings in the
  # pre-existing web UI JS establish a baseline without blocking the core
  # gates.
  web-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: make web-lint
        env:
          ZIMSERVICE_WEB_CHECK_STRICT: "1"
  # MSRV gate: fail CI if the code silently requires a newer toolchain than
  # the declared `rust-version` (1.91). Runs the DB-less unit tests (not just
  # `cargo check`) so a runtime/toolchain dependency is caught too.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91
      - run: cargo test --lib --bins --test wiremock
  # Rustdoc gate: catch broken intra-doc links and doc build failures.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with: { components: rustdoc }
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
  # DB regression gate (uninstrumented): the plain behavioral gate for all
  # DB-backed tests — lib, bins, wiremock, and the integration suite, with
  # ZIMSERVICE_REQUIRE_DB=1 turning DB-gated skips into hard failures. The
  # instrumented `coverage` job below is ratchet-only, so an llvm-cov infra
  # failure there must not vacate DB-backed regression coverage.
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16   # stock postgres:16 lacks the `vector` extension migration 001 creates
        env:
          POSTGRES_USER: zimservice
          POSTGRES_PASSWORD: zimservice
          POSTGRES_DB: zimservice
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U zimservice"
          --health-interval 2s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - run: |
          ZIMSERVICE_REQUIRE_DB=1 \
          DATABASE_URL=postgres://zimservice:zimservice@localhost:5433/zimservice \
          cargo test --lib --bins --test wiremock --test integration
  coverage:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16   # stock postgres:16 lacks the `vector` extension migration 001 creates
        env:
          POSTGRES_USER: zimservice
          POSTGRES_PASSWORD: zimservice
          POSTGRES_DB: zimservice
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U zimservice"
          --health-interval 2s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with: { components: llvm-tools-preview }
      - uses: taiki-e/install-action@cargo-llvm-cov
      # Coverage-ratchet-only job: the plain `test` job above is the
      # behavioral gate (uninstrumented, same DB-backed selection). This job
      # only enforces the ratchet — its llvm-cov run must not drop below the
      # floor — and an llvm-cov/infra failure here cannot vacate DB-backed
      # regression coverage, which the test job already gates.
      # DB-backed coverage floor (ratchet): lib/bins/wiremock plus the
      # integration suite, with ZIMSERVICE_REQUIRE_DB=1 turning DB-gated skips
      # into hard failures so poller DB writes, run_pipeline, and the whole
      # integration suite all count toward the floor.
      # `--bins` matters: the binary's DB-gated startup smoke tests
      # (single-instance refusal + the mutating guard's refuse/acquire/release,
      # src/startup.rs) run against a real Postgres. They are schema-free
      # (advisory locks + pg_locks only) and serialize with every other DB test
      # via DbExclusiveGuard (src/testing.rs: cross-process lockfile +
      # in-process slot), so the default parallel --test-threads is safe; the
      # migration drift check runs in a dedicated temp DB it drops instead of
      # tampering the shared schema_migrations.
      # Raise the floor in .github/coverage_floor.txt after a DB-backed run to
      # lock in the gain — the job fails if measured coverage drops below it,
      # so the floor can only effectively rise.
      - run: |
          ZIMSERVICE_REQUIRE_DB=1 \
          DATABASE_URL=postgres://zimservice:zimservice@localhost:5433/zimservice \
          cargo llvm-cov --lib --bins --test wiremock --test integration \
            --fail-under-lines "$(cat .github/coverage_floor.txt)"
  # Cross-platform smoke: the crate builds and its DB-less unit tests pass on
  # macOS and Windows (DB-gated tests skip — no Postgres service here). Catches
  # platform-specific compile/link issues a Linux-only CI would miss.
  non-linux:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - run: cargo build
      - run: cargo test --lib --bins --test wiremock
