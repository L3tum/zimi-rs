name: CI
on:
  push:
    branches: [master]
  pull_request:
# Least-privilege GITHUB_TOKEN: every job here only reads the repository
# (no job pushes, publishes, or uploads). Keep this block — the default
# token otherwise carries write access to the repo.
permissions:
  contents: read
# Runner notes (self-hosted, act-based):
# - The runner resolves `uses:` from the data.forgejo.org mirror, which
#   serves only `actions/*`; third-party actions (dtolnay/rust-toolchain,
#   taiki-e/install-action, rustsec/audit-check) 404 there. Rust toolchains
#   therefore come from the repo-local ./.github/actions/setup-rust
#   composite action, cargo-llvm-cov/cargo-audit install from crates.io,
#   and the RUSTSEC advisory-db is cloned from github.com.
# - The actions/* @v7 steps (checkout, setup-node) run on the runner's
#   Node 24 (the @v4 series ran on node20). The act-latest runner image
#   ships Node 24, so this holds today; revisit if the image changes.
# - The runner's JOB containers ride the host network (act-based runner
#   config), so anything a job binds is bound on the HOST — and services
#   inherit the host network too, where `ports:` mappings are a no-op and
#   service hostnames don't resolve. The old scheme (one fixed real port
#   per job — test=5432, msrv-db=5433, coverage=5434, docker=5435,
#   web-browser-smoke=5437, bench=5436, release=5438) collided as jobs were
#   added: a losing postgres can never bind and never goes healthy, and the
#   two 8899 e2e apps (docker job vs release.yml, both on master push) could
#   collide across workflows.
#   Postgres now NEVER takes a host port: each job boots its own throwaway
#   pgvector container on a PRIVATE per-job docker network
#   (.github/actions/ci-postgres) — 5432 inside the container, reached from
#   the job at the bridge IP ($ZIM_PG_IP), torn down in an `if: always()`
#   step (.github/actions/ci-postgres-teardown). No host port => no
#   cross-job or host-service collision, by construction. The e2e app
#   containers (docker job, release.yml) join the same private network and
#   are reached at their own bridge IP, so the two 8899 apps no longer share
#   a host port either.
#   Residual host port: 8877 (web-browser-smoke's in-job app process — it is
#   a bare process inside the host-network job, 127.0.0.1-only; collides
#   only with a concurrent ci.yml run or a leaked process from a killed run).
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned toolchain (1.96.0): keeps the rustdoc/clippy gates deterministic —
      # a moving `stable` once made the docs gate flaky. Bump deliberately; the
      # MSRV job below still guards 1.94. rust-toolchain.toml pins the same
      # 1.96.0 so local dev lints match this gate.
      - uses: ./.github/actions/setup-rust
        with: { toolchain: "1.96.0", components: "clippy rustfmt" }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      # Doctests live here (moved out of the `test` job).
      - run: cargo test --doc
      # M2: raw-SQL boundary lint — two rules: (1) sqlx::query* call sites
      # outside src/db/ (the sanctioned db::raw escape hatch) must carry a
      # `// RAW-OK: <reason>` marker; (2) the presentation layer
      # (src/serve/handlers/) must not own SQL — no db::raw::* call sites
      # there (move the SQL into a named src/db/ helper). POSIX sh, no
      # dependencies.
      - run: make raw-sql-lint
      # M2: module-boundary lint (scripts/check-boundaries.sh) — the
      # use-graph half of the same boundary contract (companion to
      # raw-sql-lint, which owns the raw-SQL call-site rules): P1
      # presentation-layer separation (src/mcp <-> src/serve), P2 no
      # raw-SQL string literals in presentation layers, P3 no pool creation
      # in presentation layers (pools are startup-owned, passed via
      # AppState), P4 no db::raw::* call sites in src/serve/ files OUTSIDE
      # handlers/ (extends the raw-sql lint's rule-2 scope), P5 no
      # crate::startup:: references from src/settings/ or src/serve/ (the
      # shared live env readers live in the leaf module crate::process).
      # POSIX sh, no dependencies.
      - run: make boundary-lint
      # web-check (JS syntax + CSS parse) and web-test both read
      # node_modules: the CSS half parses with css-tree (the sanctioned
      # parser dependency, mirroring jsdom), web-test boots a JSDOM
      # document — so the install comes first. Strict because the targets
      # skip silently without node/their dependency; CI always has node,
      # so a missing node/css-tree/jsdom must fail the gate, not pass it.
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: make web-check
        env:
          ZIMSERVICE_WEB_CHECK_STRICT: "1"
      # Behavioral unit tests for web/common.js helpers (apiFetch admin-auth
      # flow, esc, formatters) — same strict policy: CI always has node.
      - run: make web-test
        env:
          ZIMSERVICE_WEB_CHECK_STRICT: "1"
  # Real JS lint (eslint) of the embedded web UI: web/common.js + the
  # per-page scripts (web/index.js, web/search.js, web/settings.js). Kept as
  # a separate job (not folded into `lint`) because it needs `npm install`
  # before `make web-lint`; it runs with ZIMSERVICE_WEB_CHECK_STRICT=1, so
  # any lint finding fails this job and therefore the PR — a full blocking
  # gate, not a baseline-only check.
  web-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: make web-lint
        env:
          ZIMSERVICE_WEB_CHECK_STRICT: "1"
  # Real-browser (Playwright, headless Chromium) smoke for the web UI.
  # Exercises the library and search pages against a LIVE zimservice
  # process — the layer the jsdom suite (web-lint job) and the HTTP
  # wiremock tests cannot cover (2026-10 review, Tests: no real-browser
  # coverage). Postgres on a private per-job network (note at top —
  # $ZIM_PG_IP); the app is a bare in-job process on 127.0.0.1:8877, the
  # one residual host port (job containers ride the host network). Open
  # mode on a loopback bind is allowed by the boot policy, so no auth env is
  # needed.
  web-browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - uses: ./.github/actions/setup-rust
        with: { toolchain: "1.96.0" }
      # Private per-job postgres (note at top): 5432 inside the container,
      # reached at the bridge IP — no host port.
      - uses: ./.github/actions/ci-postgres
      - run: npm install --no-audit --no-fund
      # Chromium + its system libs; fall back to the bare browser download
      # if the runner can't apt (system deps may already be present).
      - run: npx playwright install --with-deps chromium || npx playwright install chromium
      - run: cargo build --release --bin zimservice
      - run: |
          ZIM_DIR=$(mktemp -d) \
          DATABASE_URL=postgres://zimservice:zimservice@$ZIM_PG_IP:5432/zimservice \
          ZIMSERVICE_REQUIRE_DB=1 \
          HOST=127.0.0.1 \
          PORT=8877 \
          ACCESS_MODE=open \
          target/release/zimservice serve &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8877/health >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8877/health
          ZIMSERVICE_BASE_URL=http://127.0.0.1:8877 \
            npx playwright test --config tests/web/playwright.config.mjs
          kill "$SERVER_PID" 2>/dev/null || true
      # Private-network postgres (ci-postgres action) — always.
      - if: always()
        uses: ./.github/actions/ci-postgres-teardown
  # MSRV gate: fail CI if the code silently requires a newer toolchain than
  # the declared `rust-version` (1.94). Runs the DB-less unit tests (not just
  # `cargo check`) so a runtime/toolchain dependency is caught too.
  msrv:
    runs-on: ubuntu-latest
    # rust-toolchain.toml pins 1.96.0 (dev parity with the lint gate); the
    # RUSTUP_TOOLCHAIN env var takes precedence over the file, so this job
    # really runs on 1.94 — without it the "MSRV" gate would silently
    # exercise the 1.96.0 toolchain.
    env:
      RUSTUP_TOOLCHAIN: "1.94"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with: { toolchain: "1.94" }
      - run: cargo test --lib --bins --test wiremock
  # MSRV gate for the strict-DB half: the `msrv` job above only runs the
  # DB-less unit tests, so a runtime/toolchain dependency surfaced only by the
  # DB-backed suite (lib/bins/wiremock + integration under 1.94) would slip
  # through. Runs the same DB-backed selection as `test`, but pinned to 1.94.
  msrv-db:
    runs-on: ubuntu-latest
    # RUSTUP_TOOLCHAIN overrides rust-toolchain.toml (1.96.0) — see `msrv`.
    env:
      RUSTUP_TOOLCHAIN: "1.94"
      # Contended runner (parallel DB jobs + cold compiles): extra wall-clock
      # for the real-clock loop tests (`loop_wait_budget`, src/embed/
      # auto_loop.rs). Only the failure path stretches; green is unaffected.
      ZIMSERVICE_LOOP_TEST_BUDGET_SECS: "300"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with: { toolchain: "1.94" }
      # Private per-job postgres (note at top): 5432 inside the container,
      # reached at the bridge IP — no host port.
      - uses: ./.github/actions/ci-postgres
      - run: |
          ZIMSERVICE_REQUIRE_DB=1 \
          DATABASE_URL=postgres://zimservice:zimservice@$ZIM_PG_IP:5432/zimservice \
          cargo test --lib --bins --test wiremock --test integration
      # Private-network postgres (ci-postgres action) — always.
      - if: always()
        uses: ./.github/actions/ci-postgres-teardown
  # Rustdoc gate: catch broken intra-doc links and doc build failures.
  # `--all-features` also compiles the `testing` feature's docs (src/
  # testing.rs), so a broken intra-doc link there can't stay latent: the
  # 4 private-const links found in the 2026-10 project-wide review were
  # green-local/red-CI-elsewhere exactly because this flag was missing.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with: { toolchain: "1.96.0", components: "rust-docs" }
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"
  # DB regression gate (uninstrumented): the plain behavioral gate for all
  # DB-backed tests — lib, bins, wiremock, and the integration suite, with
  # ZIMSERVICE_REQUIRE_DB=1 turning DB-gated skips into hard failures. The
  # instrumented `coverage` job below is ratchet-only, so an llvm-cov infra
  # failure there must not vacate DB-backed regression coverage.
  test:
    runs-on: ubuntu-latest
    env:
      # Contended runner (parallel DB jobs + cold compiles): extra wall-clock
      # for the real-clock loop tests (`loop_wait_budget`, src/embed/
      # auto_loop.rs). Only the failure path stretches; green is unaffected.
      ZIMSERVICE_LOOP_TEST_BUDGET_SECS: "300"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with: { toolchain: "1.96.0" }
      # Private per-job postgres (note at top): 5432 inside the container,
      # reached at the bridge IP — no host port.
      - uses: ./.github/actions/ci-postgres
      - run: |
          ZIMSERVICE_REQUIRE_DB=1 \
          DATABASE_URL=postgres://zimservice:zimservice@$ZIM_PG_IP:5432/zimservice \
          cargo test --lib --bins --test wiremock --test integration
      # Private-network postgres (ci-postgres action) — always.
      - if: always()
        uses: ./.github/actions/ci-postgres-teardown
  coverage:
    runs-on: ubuntu-latest
    env:
      # Contended runner (parallel DB jobs + cold compiles): extra wall-clock
      # for the real-clock loop tests (`loop_wait_budget`, src/embed/
      # auto_loop.rs). Only the failure path stretches; green is unaffected.
      ZIMSERVICE_LOOP_TEST_BUDGET_SECS: "300"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with: { toolchain: "1.96.0", components: "llvm-tools-preview" }
      # Private per-job postgres (note at top): 5432 inside the container,
      # reached at the bridge IP — no host port.
      - uses: ./.github/actions/ci-postgres
      # The mirror has no taiki-e/install-action — build the same tool from
      # crates.io (llvm-tools-preview, above, is its runtime dependency).
      - run: cargo install cargo-llvm-cov
      # Coverage-ratchet-only job: the plain `test` job above is the
      # behavioral gate (uninstrumented, same DB-backed selection). This job
      # only enforces the ratchet — its llvm-cov run must not drop below the
      # floor — and an llvm-cov/infra failure here cannot vacate DB-backed
      # regression coverage, which the test job already gates.
      # DB-backed coverage floor (ratchet): lib/bins/wiremock plus the
      # integration suite, with ZIMSERVICE_REQUIRE_DB=1 turning DB-gated skips
      # into hard failures so poller DB writes, run_pipeline, and the whole
      # integration suite all count toward the floor.
      # No branch-coverage gate on purpose (2026-11 review follow-up): Rust
      # 1.96's `-C instrument-coverage` emits zero branch regions (verified
      # with a minimal if/match probe program: `llvm-cov export` reports
      # `totals.branches.count = 0`), and cargo-llvm-cov has no
      # `--fail-under-branches` option to gate on anyway. The line floor is
      # the ratchet; the review's motivating case (an unexercised branch
      # inside a line-covered function — the wrapped `i64` product in
      # run_pipeline) is pinned by checked arithmetic in src/embed/pipeline.rs
      # plus the overflow unit tests there. Revisit if rustc starts emitting
      # branch regions.
      # `--bins` matters: the binary's DB-gated startup smoke tests
      # (single-instance refusal + the mutating guard's refuse/acquire/release,
      # src/startup.rs) run against a real Postgres. They are schema-free
      # (advisory locks + pg_locks only) and serialize with every other DB test
      # via DbExclusiveGuard (src/testing.rs: cross-process lockfile +
      # in-process slot), so the default parallel --test-threads is safe; the
      # migration drift check runs in a dedicated temp DB it drops instead of
      # tampering the shared schema_migrations.
      # Raise the floor in .github/coverage_floor.txt after a DB-backed run to
      # lock in the gain — the job fails if measured coverage drops below it,
      # so the floor can only effectively rise.
      - run: |
          ZIMSERVICE_REQUIRE_DB=1 \
          DATABASE_URL=postgres://zimservice:zimservice@$ZIM_PG_IP:5432/zimservice \
          cargo llvm-cov --lib --bins --test wiremock --test integration \
            --fail-under-lines "$(cat .github/coverage_floor.txt)"
      # Private-network postgres (ci-postgres action) — always.
      - if: always()
        uses: ./.github/actions/ci-postgres-teardown
  # RUSTSEC audit (2026-09 review, Sec): fail CI on known-vulnerable
  # dependencies — `cargo audit` reads `Cargo.lock` only. The lock file was
  # inspected clean in the review; this pins that against future
  # `cargo update` drift. The external `zim` 0.5 crate's robustness against
  # malformed archives (the most likely future code-execution-adjacent
  # risk; RUSTSEC can't see it) is tracked by the standalone `fuzz/`
  # cargo-fuzz workspace (fuzz_zim + fuzz_opds targets — see fuzz/README.md),
  # now gated by the dedicated .github/workflows/fuzz.yml (paths + schedule;
  # that file's notes explain why low-frequency). Local runs stay the fast
  # iteration path between gate runs: `cargo +nightly fuzz run <target>`.
  # The mirror has no rustsec/audit-check, so the equivalent runs inline —
  # which is what the action did under the hood (install cargo-audit + clone
  # advisory-db).
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with: { toolchain: "1.96.0" }
      - run: |
          cargo install cargo-audit
          git clone --depth 1 https://github.com/RustSec/advisory-db /tmp/advisory-db
          cargo audit --db /tmp/advisory-db
  # Docker image build gate: catch the toolchain (H1) and build-context
  # (H2) regressions that only surface during an actual image build, plus
  # (m3, 2026-09 review) an e2e run of the built image: boot it against a
  # real Postgres and require `/health` to go green — the build-only job
  # could not catch a runtime regression (env wiring, migration failure,
  # bind/auth startup refusal) that compiles fine.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Private per-job postgres (note at top) — the e2e app below JOINS this
      # job's network and reaches the database at $ZIM_PG_IP, so neither the
      # database nor the app takes a host port.
      - uses: ./.github/actions/ci-postgres
      - run: docker build -t zimservice:ci .
      # e2e: the app JOINS this job's private network (the ci-postgres
      # action's $ZIM_PG_NET) instead of the host network — its 0.0.0.0:8899
      # bind then lives on the bridge, reached from the job at the app's own
      # bridge IP ($APP_IP), so NO host port is taken at all (the old
      # host-network bind collided with release.yml's e2e app on 8899
      # whenever the two workflows overlapped). Postgres is at
      # $ZIM_PG_IP:5432 on the same network (no host port either).
      # `HOST=0.0.0.0` + `ACCESS_MODE=password` is the only
      # startup combination allowed on a non-loopback bind (open mode is
      # refused at boot — the Threat model). `ZIMSERVICE_REQUIRE_DB=1` turns a misrouted
      # DATABASE_URL into a hard boot failure instead of a limp serve.
      # The runner is persistent (self-hosted): a previous
      # run's container outlives this job, so clean up first (exited
      # container -> `docker run` name Conflict)
      # and again in the `always()` step below so green runs don't leak.
      # The health poll is unauthenticated on purpose: `/health` is public
      # by design (README threat model — version/counts/liveness, "treat as
      # not confidential") and is exempt from the fail-closed 503, the rate
      # limit, and the M-1 read gate (require_auth_for_reads effective-true
      # on this non-loopback bind) — exactly how a load-balancer probe will
      # hit it. A 401 here means the probe exemption regressed.
      # After the health poll: the M-1 read gate itself, exercised as an
      # unauthenticated client (GET /list must be rejected — 401 for no
      # credential, 403 for a valid-but-unscoped one), and the happy path
      # (authenticated GET /list with the admin password as Bearer must
      # return 200 — the middleware's `Authorization: Bearer <password>`
      # form, src/serve/middleware.rs). Both checks print docker logs on
      # failure, same as the health poll; the curls use `-s -o /dev/null
      # -w '%{http_code}'` with `|| true` so a transport failure (000/
      # empty) falls into the failure branch instead of tripping set -e.
      - run: |
          docker rm -f zimservice-e2e >/dev/null 2>&1 || true
          docker run -d --name zimservice-e2e --network "$ZIM_PG_NET" \
            -e DATABASE_URL=postgres://zimservice:zimservice@$ZIM_PG_IP:5432/zimservice \
            -e ZIMSERVICE_REQUIRE_DB=1 \
            -e HOST=0.0.0.0 \
            -e ACCESS_MODE=password \
            -e AUTH_PASSWORD=e2e-ci-password \
            zimservice:ci
          APP_IP="$(docker inspect -f '{{range $n, $net := .NetworkSettings.Networks}}{{$net.IPAddress}} {{end}}' zimservice-e2e | tr -d '[:space:]')"
          [ -n "$APP_IP" ] || { echo "e2e: zimservice-e2e has no bridge IP" >&2; docker logs zimservice-e2e; exit 1; }
          for i in $(seq 1 30); do
            if curl -fsS "http://$APP_IP:8899/health" >/dev/null 2>&1; then
              echo "e2e: /health is green"
              break
            fi
            sleep 2
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://$APP_IP:8899/health" || true)
          if [ "$code" != "200" ]; then
            echo "e2e: /health never went green (last status: ${code:-none})" >&2
            docker logs zimservice-e2e
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://$APP_IP:8899/list" || true)
          case "$code" in
            401|403)
              echo "e2e: unauthenticated /list rejected as required ($code)"
              ;;
            *)
              echo "e2e: unauthenticated /list returned ${code:-none} (want 401/403 — the M-1 read gate)" >&2
              docker logs zimservice-e2e
              exit 1
              ;;
          esac
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer e2e-ci-password" "http://$APP_IP:8899/list" || true)
          if [ "$code" != "200" ]; then
            echo "e2e: authenticated /list returned ${code:-none} (want 200)" >&2
            docker logs zimservice-e2e
            exit 1
          fi
          echo "e2e: authenticated /list returned 200"
          # 2026-10 review (Tests): one authenticated SEARCH assertion — the
          # e2e was list-only, so the search path (query parsing, settings
          # snapshot, the three search arms against an empty DB) had no
          # image-level coverage. An empty-DB search must return 200 with a
          # JSON body (results: []), not a 500 from a missing extension or
          # a mis-applied M-1 gate.
          body=$(curl -s -w ' %{http_code}' \
            -H "Authorization: Bearer e2e-ci-password" \
            "http://$APP_IP:8899/search?q=zimservice" || true)
          code=${body##* }
          if [ "$code" != "200" ]; then
            echo "e2e: authenticated /search returned ${code:-none} (want 200): $body" >&2
            docker logs zimservice-e2e
            exit 1
          fi
          case "$body" in
            *results*) echo "e2e: authenticated /search returned 200 with a results body" ;;
            *)
              echo "e2e: authenticated /search body lacked a results field: $body" >&2
              docker logs zimservice-e2e
              exit 1
              ;;
          esac
      # Always tear the container down (success or failure) — see the
      # cleanup note above the run step.
      - if: always()
        run: docker rm -f zimservice-e2e >/dev/null 2>&1 || true
      # Private-network postgres (ci-postgres action) — always.
      - if: always()
        uses: ./.github/actions/ci-postgres-teardown
  # Cross-platform smoke (macOS/Windows): removed — this runner fleet is
  # Linux-only (no macos-latest/windows-latest labels exist to schedule on).
  # Re-add a matrix job here if non-Linux runners appear.
