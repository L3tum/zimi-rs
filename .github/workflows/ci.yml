name: CI
on:
  push:
    branches: [master]
  pull_request:
# Least-privilege GITHUB_TOKEN: every job here only reads the repository
# (no job pushes, publishes, or uploads). Keep this block — the default
# token otherwise carries write access to the repo.
permissions:
  contents: read
# Runner notes (self-hosted, act-based):
# - The runner resolves `uses:` from the data.forgejo.org mirror, which
#   serves only `actions/*`; third-party actions (dtolnay/rust-toolchain,
#   taiki-e/install-action, rustsec/audit-check) 404 there. Rust toolchains
#   therefore come from the repo-local ./.github/actions/setup-rust
#   composite action, cargo-llvm-cov/cargo-audit install from crates.io,
#   and the RUSTSEC advisory-db is cloned from github.com.
# - The actions/* @v7 steps (checkout, setup-node) run on the runner's
#   Node 24 (the @v4 series ran on node20). The act-latest runner image
#   ships Node 24, so this holds today; revisit if the image changes.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned toolchain (1.96.0): keeps the rustdoc/clippy gates deterministic —
      # a moving `stable` once made the docs gate flaky. Bump deliberately; the
      # MSRV job below still guards 1.94. rust-toolchain.toml pins the same
      # 1.96.0 so local dev lints match this gate.
      - uses: ./.github/actions/setup-rust
        with: { toolchain: "1.96.0", components: "clippy rustfmt" }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      # Doctests live here (moved out of the `test` job).
      - run: cargo test --doc
      # M2: raw-SQL boundary lint — two rules: (1) sqlx::query* call sites
      # outside src/db/ (the sanctioned db::raw escape hatch) must carry a
      # `// RAW-OK: <reason>` marker; (2) the presentation layer
      # (src/serve/handlers/) must not own SQL — no db::raw::* call sites
      # there (move the SQL into a named src/db/ helper). POSIX sh, no
      # dependencies.
      - run: make raw-sql-lint
      # web-check (JS syntax + CSS parse) and web-test both read
      # node_modules: the CSS half parses with css-tree (the sanctioned
      # parser dependency, mirroring jsdom), web-test boots a JSDOM
      # document — so the install comes first. Strict because the targets
      # skip silently without node/their dependency; CI always has node,
      # so a missing node/css-tree/jsdom must fail the gate, not pass it.
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: make web-check
        env:
          ZIMSERVICE_WEB_CHECK_STRICT: "1"
      # Behavioral unit tests for web/common.js helpers (apiFetch admin-auth
      # flow, esc, formatters) — same strict policy: CI always has node.
      - run: make web-test
        env:
          ZIMSERVICE_WEB_CHECK_STRICT: "1"
  # Real JS lint (eslint) of the embedded web UI: web/common.js + the
  # per-page scripts (web/index.js, web/search.js, web/settings.js). Kept as
  # a separate job (not folded into `lint`) because it needs `npm install`
  # before `make web-lint`; it runs with ZIMSERVICE_WEB_CHECK_STRICT=1, so
  # any lint finding fails this job and therefore the PR — a full blocking
  # gate, not a baseline-only check.
  web-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: make web-lint
        env:
          ZIMSERVICE_WEB_CHECK_STRICT: "1"
  # MSRV gate: fail CI if the code silently requires a newer toolchain than
  # the declared `rust-version` (1.94). Runs the DB-less unit tests (not just
  # `cargo check`) so a runtime/toolchain dependency is caught too.
  msrv:
    runs-on: ubuntu-latest
    # rust-toolchain.toml pins 1.96.0 (dev parity with the lint gate); the
    # RUSTUP_TOOLCHAIN env var takes precedence over the file, so this job
    # really runs on 1.94 — without it the "MSRV" gate would silently
    # exercise the 1.96.0 toolchain.
    env:
      RUSTUP_TOOLCHAIN: "1.94"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with: { toolchain: "1.94" }
      - run: cargo test --lib --bins --test wiremock
  # MSRV gate for the strict-DB half: the `msrv` job above only runs the
  # DB-less unit tests, so a runtime/toolchain dependency surfaced only by the
  # DB-backed suite (lib/bins/wiremock + integration under 1.94) would slip
  # through. Runs the same DB-backed selection as `test`, but pinned to 1.94.
  msrv-db:
    runs-on: ubuntu-latest
    # RUSTUP_TOOLCHAIN overrides rust-toolchain.toml (1.96.0) — see `msrv`.
    env:
      RUSTUP_TOOLCHAIN: "1.94"
    services:
      postgres:
        image: pgvector/pgvector:pg16   # stock postgres:16 lacks the `vector` extension migration 001 creates
        env:
          POSTGRES_USER: zimservice
          POSTGRES_PASSWORD: zimservice
          POSTGRES_DB: zimservice
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U zimservice"
          --health-interval 2s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with: { toolchain: "1.94" }
      - run: |
          ZIMSERVICE_REQUIRE_DB=1 \
          DATABASE_URL=postgres://zimservice:zimservice@localhost:5433/zimservice \
          cargo test --lib --bins --test wiremock --test integration
  # Rustdoc gate: catch broken intra-doc links and doc build failures.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with: { toolchain: "1.96.0", components: "rust-docs" }
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
  # DB regression gate (uninstrumented): the plain behavioral gate for all
  # DB-backed tests — lib, bins, wiremock, and the integration suite, with
  # ZIMSERVICE_REQUIRE_DB=1 turning DB-gated skips into hard failures. The
  # instrumented `coverage` job below is ratchet-only, so an llvm-cov infra
  # failure there must not vacate DB-backed regression coverage.
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16   # stock postgres:16 lacks the `vector` extension migration 001 creates
        env:
          POSTGRES_USER: zimservice
          POSTGRES_PASSWORD: zimservice
          POSTGRES_DB: zimservice
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U zimservice"
          --health-interval 2s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with: { toolchain: "1.96.0" }
      - run: |
          ZIMSERVICE_REQUIRE_DB=1 \
          DATABASE_URL=postgres://zimservice:zimservice@localhost:5433/zimservice \
          cargo test --lib --bins --test wiremock --test integration
  coverage:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16   # stock postgres:16 lacks the `vector` extension migration 001 creates
        env:
          POSTGRES_USER: zimservice
          POSTGRES_PASSWORD: zimservice
          POSTGRES_DB: zimservice
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U zimservice"
          --health-interval 2s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with: { toolchain: "1.96.0", components: "llvm-tools-preview" }
      # The mirror has no taiki-e/install-action — build the same tool from
      # crates.io (llvm-tools-preview, above, is its runtime dependency).
      - run: cargo install cargo-llvm-cov
      # Coverage-ratchet-only job: the plain `test` job above is the
      # behavioral gate (uninstrumented, same DB-backed selection). This job
      # only enforces the ratchet — its llvm-cov run must not drop below the
      # floor — and an llvm-cov/infra failure here cannot vacate DB-backed
      # regression coverage, which the test job already gates.
      # DB-backed coverage floor (ratchet): lib/bins/wiremock plus the
      # integration suite, with ZIMSERVICE_REQUIRE_DB=1 turning DB-gated skips
      # into hard failures so poller DB writes, run_pipeline, and the whole
      # integration suite all count toward the floor.
      # `--bins` matters: the binary's DB-gated startup smoke tests
      # (single-instance refusal + the mutating guard's refuse/acquire/release,
      # src/startup.rs) run against a real Postgres. They are schema-free
      # (advisory locks + pg_locks only) and serialize with every other DB test
      # via DbExclusiveGuard (src/testing.rs: cross-process lockfile +
      # in-process slot), so the default parallel --test-threads is safe; the
      # migration drift check runs in a dedicated temp DB it drops instead of
      # tampering the shared schema_migrations.
      # Raise the floor in .github/coverage_floor.txt after a DB-backed run to
      # lock in the gain — the job fails if measured coverage drops below it,
      # so the floor can only effectively rise.
      - run: |
          ZIMSERVICE_REQUIRE_DB=1 \
          DATABASE_URL=postgres://zimservice:zimservice@localhost:5433/zimservice \
          cargo llvm-cov --lib --bins --test wiremock --test integration \
            --fail-under-lines "$(cat .github/coverage_floor.txt)"
  # RUSTSEC audit (2026-09 review, Sec): fail CI on known-vulnerable
  # dependencies — `cargo audit` reads `Cargo.lock` only. The lock file was
  # inspected clean in the review; this pins that against future
  # `cargo update` drift. Track the external `zim` 0.5 crate's robustness
  # against malformed archives separately (most likely future
  # code-execution-adjacent risk; RUSTSEC can't see it). The mirror has no
  # rustsec/audit-check, so the equivalent runs inline — which is what the
  # action did under the hood (install cargo-audit + clone advisory-db).
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with: { toolchain: "1.96.0" }
      - run: |
          cargo install cargo-audit
          git clone --depth 1 https://github.com/RustSec/advisory-db /tmp/advisory-db
          cargo audit --db /tmp/advisory-db
  # Docker image build gate: catch the toolchain (H1) and build-context
  # (H2) regressions that only surface during an actual image build, plus
  # (m3, 2026-09 review) an e2e run of the built image: boot it against a
  # real Postgres and require `/health` to go green — the build-only job
  # could not catch a runtime regression (env wiring, migration failure,
  # bind/auth startup refusal) that compiles fine.
  docker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16   # stock postgres:16 lacks the `vector` extension migration 001 creates
        env:
          POSTGRES_USER: zimservice
          POSTGRES_PASSWORD: zimservice
          POSTGRES_DB: zimservice
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U zimservice"
          --health-interval 2s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t zimservice:ci .
      # e2e: `--network host` lets the container reach the `postgres`
      # service hostname the runner resolves (a default-bridge container
      # could not). `HOST=0.0.0.0` + `ACCESS_MODE=password` is the only
      # startup combination allowed on a non-loopback bind (open mode is
      # refused at boot — the Threat model); `/health` stays open, which is
      # what we poll. `ZIMSERVICE_REQUIRE_DB=1` turns a misrouted
      # DATABASE_URL into a hard boot failure instead of a limp serve.
      - run: |
          docker run -d --name zimservice-e2e --network host \
            -e DATABASE_URL=postgres://zimservice:zimservice@postgres:5432/zimservice \
            -e ZIMSERVICE_REQUIRE_DB=1 \
            -e HOST=0.0.0.0 \
            -e ACCESS_MODE=password \
            -e AUTH_PASSWORD=e2e-ci-password \
            zimservice:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8899/health >/dev/null 2>&1; then
              echo "e2e: /health is green"
              exit 0
            fi
            sleep 2
          done
          docker logs zimservice-e2e
          exit 1
  # Cross-platform smoke (macOS/Windows): removed — this runner fleet is
  # Linux-only (no macos-latest/windows-latest labels exist to schedule on).
  # Re-add a matrix job here if non-Linux runners appear.
