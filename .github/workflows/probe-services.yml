# Probe: does the runner's per-job network + `services:` mechanism work?
#
# ONE-SHOT diagnostic. Delete this file after the CI migration is done.
#
# Run this AFTER setting `container.network: ""` in the runner's
# config.yaml (and restarting the daemon), BEFORE migrating the real
# CI jobs. Trigger: Forgejo UI -> repo -> Actions -> "Probe runner services".
#
# What it proves, in order:
#   1. The `postgres` service hostname resolves from inside the job
#      container (only possible on the runner-created per-job network).
#   2. postgres:5432 accepts TCP via bash /dev/tcp — the exact readiness
#      check the migrated CI jobs will use.
#   3. The Postgres wire handshake gets an auth-request 'R' for
#      user/database zimservice (the role only exists if the POSTGRES_*
#      env reached the service container).
#   4. The job container is NOT on the host network anymore (egress
#      source IP should be a private bridge address, not host LAN).
#   5. The docker socket is still available (the e2e jobs' docker
#      build/run need it — i.e. the docker_host automount survived the
#      network change).
#   6. Outbound internet from the job container (crates.io, etc.).
#   7. Whether cross-step env files propagate: both $GITHUB_ENV (legacy)
#      and $FORGEJO_ENV (the documented Forgejo name) are written and read
#      back. (On this runner, GITHUB_ENV writes stopped propagating while
#      job containers ran on the host network; both names are re-tested
#      here after the network change.) Informational — the new CI design
#      does not rely on either.
#   8. e2e pattern: a container docker-run FROM THE JOB onto the runner's
#      per-job network (a) is reachable by the job by container name and
#      (b) resolves the `postgres` service by name — the exact topology
#      the e2e app containers need.
#   9. Via the shared docker socket: the `zimservice` role is a SUPERUSER
#      and `CREATE EXTENSION vector` succeeds in the runner-managed service
#      container (CI migrations require it — pgvector is trusted=false).
#
# Expected log on success:
#   hostname resolves; "port open on attempt N";
#   "wire probe: server answered 'R' (0x52)" (auth request = role
#   'zimservice' exists = POSTGRES_* env reached the service container);
#   "VERDICT: job container on private bridge network (172.x.x.x) — per-job network (good)";
#   docker ps lists containers (incl. the postgres service);
#   "data.forgejo.org -> HTTP 200/30x";
#   "job's per-job network: ..."; "job reaches the joined container by name: OK";
#   "zimservice rolsuper=t"; "vector ext 0.x"; "probe-attach: ALL OK";
#   ZIM_PROBE_VAR_GH / ZIM_PROBE_VAR_FJ each either show their value or
#   "<unset — ... did not propagate>" (see the read-back step).

on: workflow_dispatch
name: "Probe runner services"

jobs:
  probe:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: zimservice
          POSTGRES_PASSWORD: zimservice
          POSTGRES_DB: zimservice
    steps:
      # Env-file diagnostic (write here, read back in the last step).
      # Tests BOTH the legacy GITHUB_ENV and the documented FORGEJO_ENV name.
      - name: "Env-file write (GITHUB_ENV + FORGEJO_ENV)"
        run: |
          if [ -n "${GITHUB_ENV:-}" ]; then
            echo 'ZIM_PROBE_VAR_GH=hello-via-github-env' >> "$GITHUB_ENV"
          else
            echo "GITHUB_ENV not set by runner"
          fi
          if [ -n "${FORGEJO_ENV:-}" ]; then
            echo 'ZIM_PROBE_VAR_FJ=hello-via-forgejo-env' >> "$FORGEJO_ENV"
          else
            echo "FORGEJO_ENV not set by runner"
          fi
          echo "GITHUB_ENV=${GITHUB_ENV:-<unset>}"
          echo "FORGEJO_ENV=${FORGEJO_ENV:-<unset>}"

      - name: "Probe: services, network, docker, outbound"
        run: |
          set -euo pipefail

          echo "=== 1. service hostname resolution ==="
          getent hosts postgres || { echo "PROBE FAIL: 'postgres' does not resolve"; exit 1; }

          echo "=== 2. TCP readiness (bash /dev/tcp) ==="
          ok=0
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/postgres/5432) 2>/dev/null; then
              ok=1
              echo "port open on attempt $i"
              break
            fi
            sleep 1
          done
          [ "$ok" = 1 ] || { echo "PROBE FAIL: postgres:5432 never opened"; exit 1; }

          echo "=== 3. postgres wire handshake (node, if present) ==="
          if command -v node >/dev/null 2>&1; then
            node - <<'EOF' || echo "wire probe failed (see above)"
          const net = require('net');
          // Startup message: len, protocol v3, then "user\0<user>\0" "database\0<db>\0" \0
          const kv = Buffer.concat([
            Buffer.from('user\0zimservice\0'),
            Buffer.from('database\0zimservice\0'),
            Buffer.from([0]),
          ]);
          const pkt = Buffer.alloc(4 + 4 + kv.length);
          pkt.writeUInt32BE(pkt.length, 0);
          pkt.writeUInt32BE(196608, 4);
          kv.copy(pkt, 8);
          const s = new net.Socket();
          s.setTimeout(5000);
          s.on('timeout', () => { console.log('wire probe: TIMEOUT'); process.exit(1); });
          s.on('error', e => { console.log('wire probe ERROR:', e.message); process.exit(1); });
          s.connect(5432, 'postgres', () => s.write(pkt));
          s.once('data', b => {
            const t = String.fromCharCode(b[0]);
            let extra = '';
            if (t === 'E') extra = ' — ' + b.toString('utf8', 1, 160).replace(/\0/g, ' ');
            console.log(`wire probe: server answered '${t}' (0x${b[0].toString(16)}) — ${t === 'R' ? 'auth request: role zimservice exists (POSTGRES_* env reached the service container)' : 'not an auth request; if the E payload above says the role does not exist, the POSTGRES_* env did NOT reach the service container'}${extra}`);
            process.exit(0);
          });
          EOF
          else
            echo "node not in image — skipping wire probe (TCP check above still stands)"
          fi

          echo "=== 4. job container networking (host vs per-job network) ==="
          ip -o -4 addr show 2>/dev/null || true
          cip="$(hostname -i 2>/dev/null | awk '{print $1}')"
          echo "container IP: ${cip:-unknown}"
          case "${cip:-}" in
            172.*|10.*)
              echo "VERDICT: job container on private bridge network (${cip}) — per-job network (good)"
              ;;
            192.168.*)
              echo "VERDICT: job container on ${cip} — looks like the host LAN (HOST network: container.network still non-empty, or label is ':host')"
              ;;
            *)
              echo "VERDICT: could not determine container IP — inspect the addr output above"
              ;;
          esac

          echo "=== 5. docker socket (needed by the e2e jobs) ==="
          if command -v docker >/dev/null 2>&1; then
            docker ps --format '{{.Names}}' 2>/dev/null || echo "docker CLI present but daemon not reachable"
            echo "(the postgres service container should appear in that list if the socket is shared)"
          else
            echo "no docker CLI in the job image"
          fi

          echo "=== 6. outbound internet ==="
          curl -fsS -o /dev/null -w 'data.forgejo.org -> HTTP %{http_code}\n' https://data.forgejo.org/ || echo "outbound check failed"

      # e2e pattern: a container docker-run FROM THE JOB onto the runner's
      # per-job network (the e2e app containers do exactly this), plus the
      # superuser/pgvector check inside the runner-managed service container.
      - name: "Probe: attach a container to the job network (e2e pattern)"
        run: |
          set -euo pipefail

          echo "=== 7. e2e pattern: join the job's per-job network ==="
          myip="$(hostname -i 2>/dev/null | awk '{print $1}')"
          echo "job hostname: $(hostname), job IP: ${myip:-unknown}"
          [ -n "${myip:-}" ] || { echo "PROBE FAIL: cannot determine the job container's IP"; exit 1; }
          mynet=""
          for net in $(docker network ls -q); do
            entries="$(docker network inspect -f '{{range .Containers}}{{.Name}}={{.IPv4Address}} {{end}}' "$net")"
            echo "network ${net}: ${entries}"
            case " ${entries}" in
              *"=${myip}/"*) mynet="$net" ;;
            esac
          done
          [ -n "$mynet" ] || { echo "PROBE FAIL: no network lists a container at ${myip} (the job's own network?)"; exit 1; }
          echo "job's per-job network: ${mynet}"

          # A second container (pgvector image standing in for the e2e app)
          # JOINS that network.
          docker rm -f zimci-app-probe >/dev/null 2>&1 || true
          docker run -d --name zimci-app-probe --network "$mynet" \
            -e POSTGRES_USER=probeapp -e POSTGRES_PASSWORD=probeapp -e POSTGRES_DB=probeapp \
            pgvector/pgvector:pg16
          trap 'docker rm -f zimci-app-probe >/dev/null 2>&1 || true' EXIT
          up=0
          for i in $(seq 1 30); do
            if docker exec zimci-app-probe pg_isready -q -U probeapp; then
              up=1
              break
            fi
            sleep 1
          done
          [ "$up" = 1 ] || { echo "PROBE FAIL: joined container never became ready"; docker logs zimci-app-probe; exit 1; }
          echo "joined container is up"

          # The joined container must resolve the runner-managed service by NAME.
          docker exec zimci-app-probe getent hosts postgres \
            || { echo "PROBE FAIL: 'postgres' does not resolve from a container that joined ${mynet}"; exit 1; }

          # The job must reach the joined container by NAME (user-defined-network DNS).
          if (exec 3<>/dev/tcp/zimci-app-probe/5432) 2>/dev/null; then
            echo "job reaches the joined container by name: OK"
          else
            echo "PROBE FAIL: job cannot reach 'zimci-app-probe:5432' by name"
            exit 1
          fi

          echo "=== 8. service container via the shared docker socket (superuser + pgvector) ==="
          # Find the postgres service container on the job network: the only
          # container that answers local psql as user zimservice.
          svc=""
          for c in $(docker network inspect -f '{{range .Containers}}{{.Name}} {{end}}' "$mynet" | tr ' ' '\n'); do
            if [ -n "$c" ] && [ "$c" != "zimci-app-probe" ] && docker exec "$c" psql -U zimservice -tAc "SELECT 1" >/dev/null 2>&1; then
              svc="$c"
              break
            fi
          done
          [ -n "$svc" ] || { echo "PROBE FAIL: no container on ${mynet} answered psql as zimservice"; exit 1; }
          echo "service container: ${svc}"
          docker exec "$svc" psql -U zimservice -tAc "SELECT 'zimservice rolsuper=' || rolsuper FROM pg_roles WHERE rolname='zimservice'"
          docker exec "$svc" psql -U zimservice -qc "CREATE EXTENSION IF NOT EXISTS vector"
          docker exec "$svc" psql -U zimservice -tAc "SELECT 'vector ext ' || extversion FROM pg_extension WHERE extname='vector'"
          echo "probe-attach: ALL OK"

      # Env-file diagnostic (read back what the write step put in both files)
      - name: "Env-file read back"
        run: |
          echo "ZIM_PROBE_VAR_GH='${ZIM_PROBE_VAR_GH:-<unset — GITHUB_ENV write did not propagate>}'"
          echo "ZIM_PROBE_VAR_FJ='${ZIM_PROBE_VAR_FJ:-<unset — FORGEJO_ENV write did not propagate>}'"
