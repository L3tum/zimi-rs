name: Fuzz
on:
  push:
    branches: [master]
    # Low-frequency gate, not every PR (see the runner notes below): only
    # the surface the fuzz targets exercise — plus the fuzz workspace's
    # own manifests — should trigger it.
    paths:
      - "fuzz/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/torrent/opds.rs"
      - "src/zim/index.rs"
      # Self-validation: an edit to this file is a deliberate change to the
      # job itself, so it should run the job (a fix that only touched this
      # file would otherwise wait for the next schedule/dispatch tick).
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
# Least-privilege GITHUB_TOKEN: every job here only reads the repository
# (no job pushes, publishes, or uploads). Keep this block — the default
# token otherwise carries write access to the repo. (Same note as ci.yml.)
permissions:
  contents: read
# Why this workflow exists: attacker-influenced `.zim` archive parsing via
# the third-party `zim` crate (src/zim/index.rs) and quick-xml OPDS Atom
# feed parsing (src/torrent/opds.rs) are code-execution-adjacent surface
# that RUSTSEC's advisory DB cannot see (the ci.yml audit job's note).
# This is the CI gate for the `fuzz/` cargo-fuzz workspace (fuzz_zim +
# fuzz_opds targets; see fuzz/README.md) — local runs stay the fast
# iteration path between gate runs.
# Runner notes (self-hosted, act-based):
# - Why nightly: cargo-fuzz requires a nightly toolchain (the harnesses
#   build with -Zsanitizer=address, a nightly-only rustc flag). The job
#   pins nightly-2026-09-25 (verified to exist on static.rust-lang.org)
#   for reproducibility. The repo root pins 1.96.0 via rust-toolchain.toml,
#   and rustup's toolchain-file resolution outranks `rustup default`
#   (the setup-rust step sets the default — that alone would lose to the
#   root file), so the job instead exports RUSTUP_TOOLCHAIN: the
#   highest-priority override, same pattern as the msrv jobs in ci.yml.
#   It covers both the outer `cargo fuzz` and the inner `cargo build`
#   cargo-fuzz spawns, and it does not disturb the 1.96.0 default
#   anywhere else.
# - Why paths + schedule instead of every PR: low-frequency gate — the
#   self-hosted act-based runner fleet makes per-PR nightly bootstrap
#   costly. On this host the schedule trigger may be inert (act does not
#   run scheduled workflows); the paths trigger above still fires on the
#   push events that touch the fuzzed surface, and workflow_dispatch
#   remains the manual escape hatch.
# - No Postgres service: both targets are pure parse harnesses.
jobs:
  fuzz:
    runs-on: ubuntu-latest
    # cargo-fuzz builds the harnesses with -Zsanitizer=address (nightly-
    # only). The repo-root rust-toolchain.toml (1.96.0) outranks the
    # `rustup default` the setup-rust step sets, so plain `cargo` here
    # would resolve 1.96.0 and fail on the -Z flags; RUSTUP_TOOLCHAIN
    # outranks the toolchain file (same pattern as the msrv jobs in
    # ci.yml), on the outer `cargo fuzz` and the inner `cargo build`
    # cargo-fuzz spawns alike.
    env:
      RUSTUP_TOOLCHAIN: "nightly-2026-09-25"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with: { toolchain: "nightly-2026-09-25" }
      # cargo install --version wants FULL SemVer: a two-component "0.13"
      # is a parse error ("unexpected end of input while parsing minor
      # version number"). Pinned to the newest 0.13.x exactly (crates.io
      # 0.13.2, 2026-06-09), like the nightly above; bump deliberately.
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      # 120 s per target (raised from 45 s — 2026-10 review: the 45 s gate
      # was thin for the code-execution-adjacent parse surface it guards);
      # each target's committed seed corpus (fuzz/corpus/<target>/, see
      # fuzz/README.md) seeds the run. The `schedule` trigger may be inert
      # on the act-based runners, so the per-push budget is the reliable
      # gate — keep it above the 2026-09 30–60 s floor.
      - run: |
          cd fuzz
          cargo fuzz run fuzz_zim -- -max_total_time=120
          cargo fuzz run fuzz_opds -- -max_total_time=120
