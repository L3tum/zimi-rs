<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings — zimservice</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2358a6ff'/%3E%3Ctext x='50' y='70' font-size='62' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3EZ%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
<style>
.container { max-width: 860px; margin: 0 auto; padding: 24px; }
h1 { font-size: 22px; margin-bottom: 6px; }
.sub { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
.section { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 8px 20px 12px; margin-bottom: 16px; }
.section h2 { font-size: 13px; margin: 14px 0 6px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px; }
.field { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 9px 0; border-bottom: 1px solid #21262d; }
.field:last-child { border-bottom: none; }
.field.changed .flabel { color: var(--yellow); }
.field .flabel { font-size: 14px; }
.field .desc { font-size: 11px; color: var(--muted); margin-top: 2px; }
.field .fcontrol { display: flex; align-items: center; gap: 8px; flex: none; }
.field input[type=text], .field input[type=password], .field input[type=number], .field select {
  width: 260px; padding: 6px 10px; border-radius: 4px; border: 1px solid var(--border);
  background: #0d1117; color: var(--fg); font-size: 13px;
}
.field input:focus, .field select:focus { outline: none; border-color: var(--accent); }
.field input:disabled, .field select:disabled { opacity: .5; cursor: not-allowed; }
.tag { font-size: 11px; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
.tag.lock { color: var(--yellow); border-color: #4d3800; }
.tag.chg { color: var(--green); border-color: #2ea043; }
.show-pass { background: none; border: 1px solid var(--border); border-radius: 4px; color: var(--muted); cursor: pointer; font-size: 11px; padding: 4px 7px; }
.show-pass:hover { color: var(--fg); border-color: var(--accent); }
.toggle { position: relative; width: 40px; height: 22px; flex: none; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle .slider { position: absolute; inset: 0; background: #30363d; border-radius: 11px; cursor: pointer; transition: .2s; }
.toggle .slider:before { content: ''; position: absolute; width: 18px; height: 18px; left: 2px; bottom: 2px; background: white; border-radius: 50%; transition: .2s; }
.toggle input:checked + .slider { background: #238636; }
.toggle input:checked + .slider:before { transform: translateX(18px); }
.toggle input:disabled + .slider { opacity: .4; cursor: not-allowed; }
.save-bar { position: sticky; bottom: 0; background: linear-gradient(transparent, var(--bg) 30%); padding: 16px 0 8px; display: flex; align-items: center; gap: 14px; }
.save-btn { padding: 10px 24px; border-radius: 6px; border: none; background: #238636; color: white; font-size: 14px; cursor: pointer; }
.save-btn:hover:not(:disabled) { background: #2ea043; }
.save-btn:disabled { opacity: .5; cursor: not-allowed; }
.msg { font-size: 13px; white-space: pre-line; max-width: 600px; }
.msg.success { color: var(--green); } .msg.error { color: var(--red); }
/* Per-ZIM */
.zim-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #21262d; font-size: 13px; }
.zim-row:last-child { border-bottom: none; }
.zim-row .zname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.zim-row input[type=text] { width: 180px; padding: 5px 8px; border-radius: 4px; border: 1px solid var(--border); background: #0d1117; color: var(--fg); font-size: 12px; }
.zim-row input:focus { outline: none; border-color: var(--accent); }
.zim-row .zmsg { font-size: 11px; color: var(--green); opacity: 0; transition: opacity .3s; }
.zim-row.flash { background: rgba(88,166,255,.07); border-radius: 6px; }
</style>
</head>
<body>
<nav class="nav">
  <span class="brand">zimservice</span>
  <a href="/">Library</a>
  <a href="/search.html">Search</a>
  <a href="/settings.html" class="active">Settings</a>
</nav>
<div class="container">
  <h1>Settings</h1>
  <div class="sub">Changes apply immediately (runtime). 🔒 fields are fixed by environment (set the env var and restart zimservice).</div>
  <div id="sections"><div class="sub">Loading…</div></div>

  <div class="section">
    <h2>Per-ZIM</h2>
    <div id="zimRows"><div class="sub">Loading…</div></div>
  </div>

  <div class="save-bar">
    <button class="save-btn" id="save" disabled>Save</button>
    <div class="msg" id="msg"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="/common.js"></script>
<script src="/settings.js"></script>
</body>
</html>
