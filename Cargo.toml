[package]
name = "zimservice"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
description = "Cross-ZIM search and serve platform with Postgres FTS, semantic search, and qBittorrent integration"
license = "MIT"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "fs", "io-util", "io-std"] }

# HTTP server
axum = "0.8"
tower-http = { version = "0.7", features = ["cors", "limit", "trace"] }

# OpenAPI
utoipa = { version = "5", features = ["preserve_path_order", "chrono"] }

# Database (sqlx Postgres — the only data-access layer; see db::raw)
# sqlx 0.9: the combined runtime+TLS features were deleted; runtime and TLS
# are independent features. tls-rustls-ring-native-roots loads the OS trust
# store via rustls-native-certs (pre-deadpool parity; webpki roots are
# superseded).
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-native-roots", "chrono", "json"] }

# ZIM
zim = "0.5"

# HTML extraction
deformat = { version = "0.15", features = ["readability"] }

# Parallel
rayon = "1"

# Text processing
regex = "1"

# XML (OPDS catalog)
quick-xml = { version = "0.41", default-features = false }

# JSON / serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utilities
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
# Admin-password hashing (already in the build graph transitively via
# postgres-protocol's SCRAM stack; hex is formatted with a local helper).
sha2 = "0.11"
# argon2id KDF for the admin password (SEC-M1)
argon2 = "0.6"
# salt generation for argon2id (OsRng) — feature unifies with argon2's dep
password-hash = { version = "0.5", features = ["getrandom"] }
# SEC-L5: at-rest encryption (AES-256-GCM) + KEK derivation (HKDF-SHA256)
# for the secret settings under `SECURITY_KEY` — already compiled via
# rustls (sqlx/reqwest TLS) → zero build-time cost.
ring = "0.17"
# SEC-L5: fresh random 12-byte GCM nonce per encryption — already at
# 0.2.17 in Cargo.lock via password-hash's getrandom feature → zero
# build-time cost.
getrandom = "0.2"
# StreamExt::next over reqwest's bytes_stream() in the torrent poller's stream_part
tokio-stream = "0.1"

url = "2"
# RFC 4648 base64 — OPDS feed digest decoding (already in the build graph
# transitively via reqwest, so direct use is zero build-time cost).
base64 = "0.23"
# Trusted-proxy CIDR containment + prefix parsing (access::cidr,
# WI-14/SEC-M3) — already in the build graph transitively via hyper-util,
# so direct use is zero build-time cost.
ipnet = "2"

# HTTP client (embeddings, qBittorrent)
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "cookies", "form", "rustls"] }

[target.'cfg(unix)'.dependencies]
# POSIX kill(2) for the cross-platform PID-liveness check (S2 self-healing
# instance lock): covers macOS/FreeBSD in addition to Linux.
libc = "0.2"

# Internal test support (`#[cfg(test)]` unit tests + the integration test
# target via the self-referential dev-dependency below). Not a public API —
# the `testing` module is excluded from the production library build.
[features]
testing = []

[dev-dependencies]
# Self-referential dev-dependency: activates the `testing` feature when
# compiling the integration test target, so `tests/integration/` can use
# `zimservice::testing::...` while the production library build (no features)
# still excludes the module entirely.
zimservice = { path = ".", features = ["testing"] }
# test-util: `#[tokio::test(start_paused = true)]` mock time for the
# auto_embed_loop lifecycle tests (the loop's cadence is a plain
# tokio::time::sleep, so the paused clock fast-forwards its ticks; test-only —
# dev-dependencies never enter the production build).
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
wiremock = "0.6"
dtor = "0.0.7"
# criterion: perf micro-benches (benches/{search,retrieval}.rs, `harness =
# false`). Dev-only — never enters the production build. 0.6 line: the
# conservative latest of the 0.5/0.6 range the benches target (0.7/0.8 exist
# with the same core API but raise the MSRV to 1.86+).
criterion = "0.6"

# Criterion bench targets: `harness = false` because criterion provides its
# own `main` (the default libtest harness would ignore the criterion API).
# Both seed the shared dev DB (`DATABASE_URL`) with a dedicated
# `bench_fixture` ZIM on every run — see benches/common/mod.rs.
[[bench]]
name = "search"
harness = false

[[bench]]
name = "retrieval"
harness = false

[profile.release]
lto = true
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "deny"
# WARN (not deny): the crate is 0.x with an explicitly unstable public API
# (see the API-stability note in lib.rs), so CI must not block on stragglers
# while the public surface is still being documented.
missing_docs = "warn"

[lints.clippy]
correctness = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
# LINT-3 (2026-09-14 sweep): enabled at "warn" (CI promotes via -D warnings).
# Grandfathered per site: test modules carry `expect_used` alongside
# `unwrap_used`; production sites with a deliberate panic (poisoned-lock
# idiom, checked invariants, JoinError propagation) carry a targeted
# `#[allow(clippy::expect_used)]` with a one-line LINT-3 comment.
# Groups use priority = -1 so per-lint overrides take effect (Rust 1.96).

